server:
  port: 8080

spring:
  data:
    redis:
      host: localhost
      port: 6379

  datasource:
    url: jdbc:mysql://localhost:3306/hypeflow
    username: root
    password: changeMe
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false


# External API configurations
hypeflow:
  newsapi:
    api-key: ${HYPEFLOW_NEWSAPI_API_KEY:}
    language: en
    base-url: https://newsapi.org/v2/everything
  wikipedia:
    project: en.wikipedia.org
    access: all-access
    agent: all-agents
    user-agent: HypeFlow/1.0 (https://github.com/hypeflow-org/hypeflow/)
    base-url: https://wikimedia.org/api/rest_v1
  reddit:
    enabled: false
    client-id: ${HYPEFLOW_REDDIT_CLIENT_ID:}
    client-secret: ${HYPEFLOW_REDDIT_CLIENT_SECRET:}
    user-agent: HypeFlow/0.1 (by u/${HYPEFLOW_REDDIT_USERNAME:your_reddit_username})
  gdelt:
    enabled: true
    base-url: https://api.gdeltproject.org/api/v2/doc/doc
  hackernews:
    enabled: true
    base-url: https://hn.algolia.com/api/v1
  stackexchange:
    enabled: true
    base-url: https://api.stackexchange.com
    site: stackoverflow
  arxiv:
    enabled: true
    base-url: https://export.arxiv.org/api/query
  cache:
    timeseries-ttl-hours: 12
    error-ttl-minutes: 5
  rate-limit:
    enabled: true
    requests-per-minute: 30